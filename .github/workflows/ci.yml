name: CI

# WHEN this runs:
#  - on every push to `main` (so a bad merge is caught immediately), and
#  - on every pull request that targets `main` (so problems are caught BEFORE
#    they merge — this is the important one).
# The private `nhentai` branch is never pushed, so it never triggers CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again while a run is still going for the same branch/PR, cancel
# the older run instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis / style. Runs in parallel with the tests as its own check,
  # so you can see at a glance whether it was code or style that failed.
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # SwiftLint is preinstalled on the macOS runner image; fall back to brew
      # if a future image drops it. `.swiftlint.yml` at the repo root is the
      # config. `--reporter github-actions-logging` surfaces each violation as
      # an inline annotation on the PR. Exit is non-zero only on error-severity
      # violations, so warnings inform without blocking the merge.
      - name: Run SwiftLint
        run: |
          swiftlint version || brew install swiftlint
          swiftlint lint --reporter github-actions-logging

  unit-tests:
    name: Build & unit tests
    # Pinned image: macos-15 ships Xcode 16 (matches this project's file format,
    # objectVersion 70) and iOS 18 simulators (deployment target is 17.5).
    # Pinning — vs `macos-latest` — means the toolchain only changes when we
    # choose to bump it, not silently when GitHub moves `latest`.
    runs-on: macos-15
    steps:
      # 1. Copy the repository onto the runner.
      - name: Check out the code
        uses: actions/checkout@v5

      # 2. Recreate the gitignored Secrets.xcconfig. It defines MAL_CLIENT_ID and
      #    is the app target's *base configuration*, so the build cannot resolve
      #    without it. Unit tests never call MyAnimeList, so a placeholder value
      #    compiles fine. If a job ever needs the real key, store it as a repo
      #    secret and use: echo "MAL_CLIENT_ID = ${{ secrets.MAL_CLIENT_ID }}".
      - name: Create placeholder Secrets.xcconfig
        run: echo "MAL_CLIENT_ID = ci-placeholder" > Secrets.xcconfig

      # 3. Record the toolchain in the log — invaluable when something builds
      #    locally but breaks only on CI.
      - name: Show Xcode version
        run: xcodebuild -version

      # 4. Pick whichever numbered iPhone simulator this runner image actually
      #    ships, rather than hardcoding a device that may not exist here.
      - name: Choose a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | xargs)
          echo "Chosen simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # 5. Build the app and run ONLY the unit test target. The live UI tests hit
      #    the real MyAnimeList/MangaDex APIs (~1-3 min each, rate-limited), which
      #    would make CI slow and flaky — they stay a local/manual gate. The
      #    *hermetic* UI tests do run here, in the job below.
      #    -parallel-testing-enabled NO avoids spawning cloned simulators.
      - name: Build & run unit tests
        run: |
          xcodebuild \
            -scheme MangaCarta \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -parallel-testing-enabled NO \
            test -only-testing:MangaCartaTests

  # The half of the UI target that does not touch the network (#134).
  #
  # WHY THIS JOB EXISTS: both UI bundles rotted for two weeks without turning
  # anything red, because CI ran neither. The cause was an accessibility label
  # change no test could notice — exactly what a UI test is for. A suite that
  # cannot run in CI and is not run locally either is not coverage, it is the
  # appearance of it.
  #
  # WHAT IS IN SCOPE: the suites listed below launch with `-uitest-updates-state`,
  # which swaps in a deterministic fixture registry and isolated storage. They make
  # no network request, so they are as deterministic as the unit tests and belong in
  # the must-be-green set.
  #
  # WHAT IS DELIBERATELY NOT: everything in `MangaCartaUITests.swift`. Those drive
  # the real reader against live MangaDex/MyAnimeList, and live catalogs move under
  # them — #134's second cause was a title WeebCentral simply stopped carrying. They
  # are a local, run-by-name gate; see that file's header.
  #
  # ADDING A SUITE HERE IS A CLAIM that it makes no network request. If a suite in
  # this list starts failing intermittently, that claim is what to re-check first.
  ui-tests:
    name: Hermetic UI tests
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Create placeholder Secrets.xcconfig
        run: echo "MAL_CLIENT_ID = ci-placeholder" > Secrets.xcconfig

      - name: Choose a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | xargs)
          echo "Chosen simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run the hermetic UI suites
        run: |
          xcodebuild \
            -scheme MangaCarta \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -parallel-testing-enabled NO \
            test \
            -only-testing:MangaCartaUITests/UpdatesUITests \
            -only-testing:MangaCartaUITests/SourcePreferenceUITests
